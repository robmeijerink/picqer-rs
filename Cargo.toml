[package]
name = "picqer-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unofficial async client for the Picqer API"
license = "MIT"
repository = "https://github.com/robmeijerink/picqer-rs"
readme = "README.md"
keywords = ["picqer", "warehouse", "fulfilment", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github", "tests", "xtask", ".cargo"]

[workspace]
members = ["xtask"]

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
blocking = ["reqwest/blocking"]

[dependencies]
base64 = "0.23"
hmac = "0.13"
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["time"] }
url = { version = "2", features = ["serde"] }
zeroize = "1"

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
